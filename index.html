<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Veloura — An Extraordinary Dining Experience</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            gold: '#D4AF37',
            goldLight: '#F3E5AB',
            dark: '#0D0D0D',
            card: '#161616',
            cream: '#F9F6F0',
            muted: '#A3A3A3'
          }
        },
        fontFamily: {
          serif: ['Cormorant Garamond', 'serif'],
          sans: ['Manrope', 'sans-serif'],
        }
      }
    }
  }
</script>
</head>
<body class="bg-brand-dark text-brand-cream font-sans antialiased overflow-x-hidden">

<!-- NAVBAR -->
<header class="fixed top-0 left-0 right-0 z-50 bg-brand-dark/90 backdrop-blur-md border-b border-white/10 transition-all">
  <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
    <a href="index.html" class="font-serif text-2xl tracking-[0.3em] font-semibold text-brand-gold">VELOURA</a>
    
    <nav class="hidden md:flex items-center space-x-8 text-sm tracking-widest uppercase">
      <a href="index.html" class="text-brand-gold">Home</a>
      <a href="menu.html" class="hover:text-brand-gold transition">Menu</a>
      <a href="about.html" class="hover:text-brand-gold transition">About</a>
      <a href="gallery.html" class="hover:text-brand-gold transition">Gallery</a>
      <a href="reservation.html" class="hover:text-brand-gold transition">Reservations</a>
      <a href="contact.html" class="hover:text-brand-gold transition">Contact</a>
    </nav>

    <div class="flex items-center space-x-5">
      <a href="reservation.html" class="hidden sm:inline-block bg-brand-gold text-brand-dark px-5 py-2 rounded-full font-medium text-xs tracking-wider uppercase hover:bg-brand-goldLight transition">Book A Table</a>
      <a href="cart.html" class="relative p-2 text-brand-cream hover:text-brand-gold">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        <span class="cart-count absolute -top-1 -right-1 bg-brand-gold text-brand-dark text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </a>
      <a href="login.html" class="p-2 text-brand-cream hover:text-brand-gold"><i data-lucide="user" class="w-5 h-5"></i></a>
    </div>
  </div>
</header>

<!-- HERO -->
<section class="relative min-h-screen flex items-center justify-center pt-20 px-6 text-center">
  <div class="max-w-3xl mx-auto z-10">
    <p class="text-brand-gold tracking-[0.4em] uppercase text-xs mb-4">Curated Gastronomy</p>
    <h1 class="font-serif text-5xl md:text-7xl font-normal leading-tight mb-6">Explore Our <br/><span class="italic text-brand-gold">Signature Menu</span></h1>
    <p class="text-brand-muted text-base max-w-lg mx-auto mb-10">Select a category to view our meticulously plated creations.</p>
    
    <!-- DYNAMIC CATEGORY BUTTONS -->
    <div class="flex flex-wrap justify-center gap-3 mb-12">
      <button onclick="filterCategory('BBQ & Grill')" class="cat-btn bg-brand-gold text-brand-dark px-5 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">BBQ & Grill</button>
      <button onclick="filterCategory('Starters')" class="cat-btn border border-white/20 hover:border-brand-gold px-5 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">Starters</button>
      <button onclick="filterCategory('Main Course')" class="cat-btn border border-white/20 hover:border-brand-gold px-5 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">Main Course</button>
      <button onclick="filterCategory('Burgers')" class="cat-btn border border-white/20 hover:border-brand-gold px-5 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">Burgers</button>
      <button onclick="filterCategory('Pizza')" class="cat-btn border border-white/20 hover:border-brand-gold px-5 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">Pizza</button>
      <button onclick="filterCategory('Desi Cuisine')" class="cat-btn border border-white/20 hover:border-brand-gold px-5 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">Desi Cuisine</button>
      <button onclick="filterCategory('Chinese')" class="cat-btn border border-white/20 hover:border-brand-gold px-5 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">Chinese</button>
      <button onclick="filterCategory('Pasta')" class="cat-btn border border-white/20 hover:border-brand-gold px-5 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">Pasta</button>
      <button onclick="filterCategory('Seafood')" class="cat-btn border border-white/20 hover:border-brand-gold px-5 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">Seafood</button>
      <button onclick="filterCategory('Desserts')" class="cat-btn border border-white/20 hover:border-brand-gold px-5 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">Desserts</button>
      <button onclick="filterCategory('Beverages')" class="cat-btn border border-white/20 hover:border-brand-gold px-5 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition">Beverages</button>
    </div>
  </div>
</section>

<!-- MENU ITEMS DISPLAY FROM SUPABASE -->
<section class="max-w-7xl mx-auto px-6 py-12">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="featured-dish-grid">
    <!-- Items from Supabase will load here automatically -->
  </div>
</section>

<script src="js/supabase-client.js"></script>
<script src="js/main.js"></script>
<script src="js/index.js"></script>
<script>
  lucide.createIcons();
  
  function filterCategory(categoryName) {
    if (window.loadCategoryDishes) {
      window.loadCategoryDishes(categoryName);
    }
  }
</script>
</body>
</html>
